aid: salient
name: Salient
description: 'Salient (Skwid Inc.) is an AI-native loan servicing and collections platform for consumer
  lenders — banks, credit unions, captive lenders, and specialty finance companies. It builds compliance-first
  AI voice and chat agents that automate servicing, collections, audit, insurance claims, chargebacks, and
  chargeoff workflows with native FDCPA, TCPA, and CFPB compliance. Its named agent products include Taylor
  (omnichannel servicing and collections), Marshall (automated audit), Flyn (total-loss insurance claims),
  Alex (chargebacks and disputes), and Melanie (chargeoffs). Founded in 2023 and backed by Andreessen Horowitz,
  Matrix Partners, and Y Combinator, Salient exposes a partner integration and onboarding API behind an
  authenticated developer portal. This profile was enriched from public web surfaces; the API reference is
  gated behind login so no public machine-readable specification was harvested.'
